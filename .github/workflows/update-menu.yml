name: Aktualizace menu

on:
  schedule:
    - cron: "0 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v5

      - name: Nastavení Pythonu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalace Python knihoven
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests playwright

      - name: Instalace Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Spuštění scraperu
        run: |
          python scraper.py

      - name: Uložení aktualizovaného menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add menu.json u_holise.json kozlovna.json

          git diff --cached --quiet || git commit -m "Aktualizace menu"

      - name: Odeslání změn na GitHub
        run: |
          git pull --rebase origin main
          git push